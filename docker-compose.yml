# Жергілікті тексеру және CI smoke-тест: `docker compose up --build --wait`
# → http://localhost:8080  (backend бөлек: DevUMRA/kassa-template-backend-django, http://localhost:8000)
# Production/песочницада бұл файл қолданылмайды: айнымалыларды платформа береді.
# Backend-тің CORS_ALLOWED_ORIGINS тізімінде http://localhost:8080 болуы тиіс.

services:
  app:
    build: .
    image: ${APP_IMAGE:-kassa-frontend:local}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      API_URL: ${API_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
