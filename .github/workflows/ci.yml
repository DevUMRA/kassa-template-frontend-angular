# CI: линтер + типтер → unit-тесттер → Docker бейнесі + smoke-тест → (тек шаблон репода) бейнені GHCR-ге жариялау.
# Командалардың репосында соңғы қадам орындалмайды: деплойды Coolify өзі жасайды (main-ге push).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: ESLint (angular-eslint + typescript-eslint)
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck
      # Шаблондардың типтері (strictTemplates) тек Angular компиляторында тексеріледі
      - name: Production build
        run: npm run build

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Vitest + jsdom: браузер керек емес
      - run: npm test

  docker:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Бейнені жинап, іске қосу (smoke)
        env:
          API_URL: https://backend.example.test
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          curl -fsS -H "Host: localhost" http://127.0.0.1:8080/health | grep -qx ok
          curl -fsS http://127.0.0.1:8080/config.js | grep -F '"https://backend.example.test"'
          # SPA routing: белгісіз жол → index.html
          curl -fsS http://127.0.0.1:8080/inventory/1 | grep -q '<app-root>'
          # root емес
          test "$(docker compose exec -T app id -u)" != "0"
          # Coolify healthcheck-і сияқты: контейнер ішінен localhost (IPv6 болса ::1)
          docker compose exec -T app wget -qO- http://localhost:8080/health
      - name: Сәтсіз болса — логтар
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()

      # Тек Qoldanba шаблонының өзінде: дайын бейне — команданың алғашқы деплойы осыдан басталады
      - name: GHCR тегтері
        id: meta
        if: github.event.repository.is_template && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/login-action@v3
        if: steps.meta.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outcome == 'success'
      - uses: docker/build-push-action@v6
        if: steps.meta.outcome == 'success'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
